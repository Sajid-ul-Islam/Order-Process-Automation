    <title>Checkout Page - Hick's Law Violation Example</title>
</head>
<body>
    <!-- VIOLATION EXAMPLE: Multiple primary actions, premature advanced options -->
    <details><summary>Advanced Options</summary><details><summary>Advanced Options</summary><details><summary>Advanced Options</summary><details><summary>Advanced Options</summary><details><summary>Advanced Options</summary><details><summary>Advanced Options</summary><div class="checkout-page">
        <h1>Complete Your Order</h1>
        
        <!-- VIOLATION: Three primary buttons competing for attention -->
        <div class="action-buttons">
            <button class="btn-primary">Complete Order</button>
            <button class="btn-secondary">Save for Later</button>
            <button class="btn-secondary">Continue Shopping</button>
        </div>
        
        <!-- VIOLATION: Advanced options visible by default -->
        <div class="advanced-settings">
            <h3>Advanced Options</h3>
            <label>
                <input type="checkbox" name="gift-wrap" />
                Gift Wrap ($5.99)
            </label>
            <label>
                <input type="checkbox" name="insurance" />
                Shipping Insurance ($2.99)
            </label>
            <label>
                <input type="checkbox" name="custom-message" />
                Custom Message Card
            </label>
            <label>
                <input type="checkbox" name="priority-shipping" />
                Priority Processing
            </label>
        </div></details></details></details></details></details></details>
        
        <!-- VIOLATION: Equal button hierarchy in button group -->
        <div class="button-group">
            <button class="btn">Cancel</button>
            <button class="btn">Save Draft</button>
            <button class="btn">Submit Application</button>
        </div>
        
        <!-- VIOLATION: Cluttered menu with 12 items -->
        <nav class="main-nav">
            <a href="/home">Home</a>
            <a href="/profile">Profile</a>
            <a href="/settings">Settings</a>
            <a href="/notifications">Notifications</a>

            <a href="/music">Music</a>
            <a href="/events">Events</a>
            <a href="/groups">Groups</a>
            <a href="/marketplace">Marketplace</a>
        </nav>
    </div>
</body>
</html>
