apiVersion: apps/v1
kind: Deployment
metadata:
  name: deen-ops-terminal
  namespace: production
  labels:
    app.kubernetes.io/name: deen-ops-terminal
    app.kubernetes.io/part-of: deen-commerce-ops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: deen-ops-terminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deen-ops-terminal
    spec:
      containers:
      - name: app
        image: deen-ops-terminal:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-streamlit
          containerPort: 8501
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "2000m"
            memory: "2048Mi"
        startupProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 5 # 25s startup grace window
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        envFrom:
        - secretRef:
            name: deen-ops-secrets
