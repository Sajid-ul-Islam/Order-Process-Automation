apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deen-ops-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Load Balancer & WebSocket Timeouts
    alb.ingress.kubernetes.io/load-balancer-attributes: "idle_timeout.timeout_seconds=300"
    alb.ingress.kubernetes.io/target-group-attributes: "deregistration_delay.timeout_seconds=60,stickiness.enabled=true,stickiness.type=lb_cookie,stickiness.lb_cookie.duration_seconds=10800"
    alb.ingress.kubernetes.io/healthcheck-path: "/_stcore/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "3"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
spec:
  rules:
  - host: ops.deencommerce.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deen-ops-service
            port:
              number: 8501
