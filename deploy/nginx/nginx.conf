events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  310s;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream streamlit_backend {
        ip_hash; # Session affinity
        server app:8501 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name ops.deencommerce.com;

        # WebSocket & Long-Polling Proxy Configuration
        location / {
            proxy_pass http://streamlit_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended Timeouts for Streamlit WebSockets
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 5s;

            # Buffer tuning
            proxy_buffering off;
        }

        # Dedicated Health Endpoint Probe
        location /_stcore/health {
            proxy_pass http://streamlit_backend/_stcore/health;
            proxy_http_version 1.1;
            proxy_read_timeout 3s;
            proxy_connect_timeout 2s;
            access_log off;
        }
    }
}
