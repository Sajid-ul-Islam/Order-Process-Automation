[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "order-process-automation"
version = "0.1.0"
description = "Order Process Automation & Live Operations Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.2",
    "polars[rtcompat]>=0.20.30",
    "numpy>=1.26.4",
    "plotly>=5.22.0",
    "openpyxl>=3.1.2",
    "xlsxwriter>=3.2.0",
    "toml>=0.10.2",
    "duckdb>=1.0.0",
    "tenacity>=8.3.0",
    "rapidfuzz>=3.0.0",
    "requests>=2.32.3",
    "aiohttp>=3.9.5",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "statsmodels>=0.14.2",
]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "scripts"]
