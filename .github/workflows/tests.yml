name: Tests (disabled — tests removed)

on:
  # Disabled: tests/ directory has been removed from the project
  # workflow_dispatch: allow manual trigger if tests are re-added later
  push:
    branches: [ never-run ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Tests disabled
        run: echo "Tests directory has been removed. Re-enable by restoring tests/ and updating this workflow."
