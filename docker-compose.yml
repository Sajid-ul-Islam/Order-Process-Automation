services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deen-ops-dev
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Hot-reload: mount source code so edits reflect without rebuild
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./scripts:/app/scripts
      # Persist runtime data across container restarts
      - ./data:/app/data
      - ./resources:/app/resources
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 2
    restart: unless-stopped
    stdin_open: true
    tty: true
